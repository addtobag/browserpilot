name: Bug report
description: Something isn't working as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest code that shows the problem.
      render: php
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: Driver
      options: [pilot, browserbase, steel, local, fake]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Browser Pilot 0.1.0, Laravel 12.x, PHP 8.4
    validations:
      required: true
