name: Feature request
description: Suggest something Browser Pilot should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job, not the solution, so we understand the need.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
